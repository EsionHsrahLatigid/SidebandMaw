name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      force_heavy:
        description: Run heavy plugin builds for manual dispatch
        required: false
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: EsionHsrahLatigid/juce-ci/.github/workflows/plugin-ci.yml@926c5bb10335c29503f92869169759ec18d71449
    permissions:
      contents: read
    with:
      product_name: SidebandMaw
      product_slug: sidebandmaw
      cmake_option_prefix: SIDEBANDMAW
      debug_targets_json: '["SidebandMawTests"]'
      release_test_targets_json: '["SidebandMawTests","SidebandMawIntegrationTests","SidebandMawPluginLoadTest"]'
      windows_debug_plugins: false

  public-copy:
    name: Public copy guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout EHL skills
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: EsionHsrahLatigid/ehl-skills
          ref: 4c265d215cff999adcf4ceca7b470ad1da38e483
          path: .work/ehl-skills

      - name: Run public history guard
        run: python3 .work/ehl-skills/skills/develop-ehl-plugins/scripts/check_public_text.py --history .
